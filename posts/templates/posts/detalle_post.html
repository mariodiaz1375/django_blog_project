{% extends "posts/base.html" %}
{% block title %}{{ post.titulo }} | Mi Blog{% endblock %}
{% block content %}
    <article>
        <h2>{{ post.titulo }}</h2>
        <p><strong>Autor:</strong> {{ post.autor }}</p>
        <p><strong>Fecha de creación:</strong> {{ post.fecha_creacion|date:"d/m/Y H:i" }}</p>
        <p><strong>Contenido:</strong> {{ post.contenido }}</p>
    </article>
    <a href="{% url 'lista_posts' %}">Volver al listado</a>
{% endblock %}
