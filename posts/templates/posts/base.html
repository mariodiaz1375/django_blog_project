<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mi Blog{% endblock %}</title>
</head>
<body>
    <header>
        <h1>Mi Blog</h1>
        <nav>
            <a href="{% url 'inicio' %}">Inicio</a>
            <a href="{% url 'lista_posts' %}">Posts</a>
            <a href="{% url 'contacto' %}">Contacto</a>

        {% endblock %}
    </main>
    <footer>
        <p>Creado con Django por Mario Diaz</p>
    </footer>
</body>
</html>
