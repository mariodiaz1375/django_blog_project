<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Posts</title>
</head>
<body>
    <h1>Posts del blog</h1>
    <ul>
        {% for post in posts %}
            <li>
                <a href="{% url 'detalle_post' post.id %}">
                    {{ post.titulo }}
                </a>
                - {{ post.autor }}
            </li>
        {% endfor %}
    </ul>
</body>
</html>
