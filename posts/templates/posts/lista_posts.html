{% extends "posts/base.html" %}
{% block title %}Posts | Mi Blog{% endblock %}
{% block content %}
    <h2>Listado de posts</h2>

    <form method="get">
        {{ form.as_p }}
        <button type="submit">Buscar</button>
        <a href="{% url 'lista_posts' %}">Limpiar</a>
    </form>

    <ul>
        {% for post in posts %}
            <li>
                <!-- <a href="{% url 'detalle_post' post.id %}"> -->
                <a href="{% url 'detalle_post' post.slug %}"> 
                    {{ post.titulo }}
                </a>
                - {{ post.autor.username }}
            </li>
        {% endfor %}
    </ul>
    <a href="{% url 'crear_post' %}">Crear nuevo post</a>
{% endblock %}
