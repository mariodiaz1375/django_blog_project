{% extends "posts/base.html" %}
{% block title %}Editar mi perfil{% endblock %}
{% load static %}
{% block content %}
    <h1>Editar perfil</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
    </form>
    <a href="{% url 'mi_perfil' %}">Cancelar</a>
{% endblock %}
